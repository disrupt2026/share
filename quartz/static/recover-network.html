th[aria-sort=ascending]::after{content:" ▲"}th[aria-sort=descending]::after{content:" ▼"}

.tag{display:inline-block;font-size:12px;border-radius:999px;padding:1px 8px;background:var(--acc-soft);color:var(--acc);margin:0 4px 3px 0;white-space:nowrap}
.tag.w{background:var(--warn-soft);color:var(--warn)}
